# 실행: docker compose -f docker-compose.spark.yaml up -d
x-spark-common: &spark-common
  image: spark:3.5.3-python3
  volumes:
    - ./jobs:/opt/spark/jobs:ro
    - ./data:/opt/spark/data:ro
  networks:
    - spark-net

services:
  spark-master:
    <<: *spark-common
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/json/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  spark-worker:
    <<: *spark-common
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--host", "spark-worker", "--cores", "2", "--memory", "2g", "--webui-port", "8081", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8081"

networks:
  spark-net:
